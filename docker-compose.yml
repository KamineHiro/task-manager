version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_USER=taskapp
      - POSTGRES_PASSWORD=taskapp123
      - POSTGRES_DB=taskmanagement
      - POSTGRES_HOST=db
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp123
      POSTGRES_DB: taskmanagement
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data: 